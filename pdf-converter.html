<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free PDF Converter Suite | OmniTools</title>
<meta name="description" content="Merge, split, extract pages, and convert documents to and from PDF seamlessly. Secure in-browser processing.">
<style>
  /* Locks the outer page to prevent scrolling and flickering */
  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background-color: #0e1117;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
  }
  
  /* Fixed gradient banner - PDF Orange */
  .premium-banner {
    background: linear-gradient(to bottom, #431407, #0e1117);
    padding: 24px 24px 30px 24px;
    text-align: center;
    flex-shrink: 0;
  }
  
  .banner-content {
    max-width: 750px;
    margin: 0 auto;
  }

  .premium-banner h1 {
    margin: 0 0 6px 0;
    font-size: 1.8rem;
    font-weight: 800;
    /* Amber to Orange text gradient */
    background: linear-gradient(135deg, #fbd38d, #fb923c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.02em;
  }
  
  .premium-banner p {
    margin: 0;
    font-size: 0.95rem;
    line-height: 1.4;
    color: #94a3b8;
  }
  
  /* Tool container overlapping the iframe seam */
  .tool-wrapper {
    width: 100%;
    flex-grow: 1;
    background-color: #0e1117;
    margin-top: -20px;
    position: relative;
    z-index: 90;
  }
  
  iframe {
    border: none;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>

<div class="premium-banner">
  <div class="banner-content">
    <h1>PDF Converter Suite</h1>
    <p>Seamlessly merge multiple PDFs, split large documents, extract specific pages, and convert files. All document processing is done securely directly in your browser.</p>
  </div>
</div>

<div class="tool-wrapper">
  <iframe src="https://omnitools.streamlit.app/PDF_Converter?embed=true" allow="clipboard-read; clipboard-write;">
    <p>Your browser does not support iframes. Please visit our tool directly.</p>
  </iframe>
</div>

</body>
</html>
