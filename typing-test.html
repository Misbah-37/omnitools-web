<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speed Typing Test | OmniTools</title>
  <link rel="icon" type="image/png" href="favicon.png">
<meta name="description" content="Test your typing speed and accuracy in real-time. Track your WPM and improve your keyboard skills for free.">
<style>
  /* Home Button */
.home-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: #94a3b8;
  text-decoration: none;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-weight: 600;
  padding: 10px 18px;
  margin: 16px 24px;
  background-color: #1e293b;
  border: 1px solid #334155;
  border-radius: 8px;
  transition: all 0.2s ease;
  position: absolute;
  top: 0;
  left: 0;
  z-index: 100;
}
.home-btn:hover {
  color: #f8fafc;
  border-color: #64748b;
  background-color: #334155;
}
  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background-color: #0e1117;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
  }
  
  .premium-banner {
    background: linear-gradient(to bottom, #312e81, #0e1117);
    padding: 24px 24px 30px 24px;
    text-align: center;
    flex-shrink: 0;
  }
  
  .banner-content {
    max-width: 750px;
    margin: 0 auto;
  }

  .premium-banner h1 {
    margin: 0 0 6px 0;
    font-size: 1.8rem;
    font-weight: 800;
    /* Indigo/Purple text gradient */
    background: linear-gradient(135deg, #a5b4fc, #6366f1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.02em;
  }
  
  .premium-banner p {
    margin: 0;
    font-size: 0.95rem;
    line-height: 1.4;
    color: #94a3b8;
  }
  
  .tool-wrapper {
    width: 100%;
    flex-grow: 1;
    background-color: #0e1117;
    margin-top: -20px;
    position: relative;
    z-index: 90;
  }
  
  iframe {
    border: none;
    width: 100%;
    height: 100%;
    display: block;
    position: relative;
    z-index: 2; /* Keeps iframe above the loader once loaded */
  }

  /* --- New Native Loading Spinner --- */
  .loader-container {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    z-index: 1; /* Sits behind the iframe */
  }

  .spinner {
    width: 48px;
    height: 48px;
    border: 4px solid #1e293b;
    border-top: 4px solid #6366f1; /* Indigo Accent to match banner */
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  .loader-text {
    color: #94a3b8;
    font-size: 1rem;
    font-weight: 600;
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

/* Mobile Responsive Fix */
@media (max-width: 768px) {
  .home-btn {
    margin: 12px 16px;
    padding: 8px 14px;
    font-size: 0.85rem;
  }
  .premium-banner {
    padding-top: 70px; /* Pushes the title down below the floating button */
  }
}
</style>
</head>
<body>
  <a href="index.html" class="home-btn">← Back to Home</a>

<div class="premium-banner">
  <div class="banner-content">
    <h1>Speed Typing Test</h1>
    <p>Test your typing speed and accuracy in real-time. Track your Words Per Minute (WPM), monitor your error rate, and improve your keyboard skills instantly in your browser.</p>
  </div>
</div>

<div class="tool-wrapper">
  
  <!-- Loading Skeleton Animation -->
  <div class="loader-container" id="loadingSkeleton">
    <div class="spinner"></div>
    <div class="loader-text">Waking up the server...</div>
  </div>

  <!-- Original Streamlit Iframe with onload event -->
  <iframe src="https://omnitools.streamlit.app/Typing_Test?embed=true" allow="clipboard-read; clipboard-write;" onload="document.getElementById('loadingSkeleton').style.display='none'">
    <p>Your browser does not support iframes. Please visit our tool directly.</p>
  </iframe>
  
</div>

</body>
</html>
