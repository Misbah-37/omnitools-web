<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Engine | Pro Utilities</title>
<style>
  /* --- Adobe-Style Clean Resets --- */
  body, html {
    margin: 0;
    padding: 0;
    background-color: #000000; /* Pure black background */
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* --- Minimalist Global Nav --- */
  .global-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
    background-color: #000000;
    border-bottom: 1px solid #222222;
  }
  
  .nav-brand {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .nav-links {
    display: flex;
    gap: 32px;
  }
  
  .nav-links a {
    color: #999999;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    transition: color 0.2s;
  }
  
  .nav-links a:hover, .nav-links a.active {
    color: #ffffff;
  }

  /* --- The Adobe-Style Hero --- */
  .clean-header {
    max-width: 800px;
    margin: 100px auto 60px auto;
    padding: 0 24px;
    text-align: center;
  }

  .clean-header h1 {
    font-size: 3.5rem;
    font-weight: 700;
    letter-spacing: -0.04em;
    margin: 0 0 20px 0;
    line-height: 1.1;
  }

  .clean-header p {
    font-size: 1.25rem;
    color: #999999;
    margin: 0 auto 40px auto;
    line-height: 1.5;
    max-width: 600px;
  }

  /* The Signature Solid Accent Button */
  .btn-accent {
    background-color: #1473E6; /* Classic Adobe Blue */
    color: #ffffff;
    border: none;
    padding: 14px 32px;
    border-radius: 24px; /* Pill shape commonly used by Adobe */
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s;
  }

  .btn-accent:hover {
    background-color: #0d66d0;
  }

  /* --- Clean Tool Container --- */
  .tool-container {
    max-width: 800px;
    margin: 0 auto 100px auto;
    padding: 40px;
    background-color: #121212; /* Very subtle contrast against black */
    border: 1px solid #222222;
    border-radius: 16px;
  }

  .st-radio-group {
    display: flex;
    gap: 16px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }

  .st-radio-option {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.95rem;
    color: #cccccc;
    cursor: pointer;
  }

  .st-radio-option input {
    accent-color: #1473E6; /* Matches the button */
    width: 18px;
    height: 18px;
  }
</style>
</head>
<body>

<nav class="global-nav">
  <div class="nav-brand">Pro Utilities</div>
  <div class="nav-links">
    <a href="#">PDF Suite</a>
    <a href="#">File Organizer</a>
    <a href="#">Photo Resizer</a>
    <a href="#" class="active">Typing Engine</a>
  </div>
</nav>

<div class="clean-header">
  <h1>Typing Engine.</h1>
  <p>Measure your typing speed and accuracy in real-time. A distraction-free environment to improve your keyboard velocity.</p>
  <button class="btn-accent">Start Typing Test</button>
</div>

<div class="tool-container">
  <div class="st-radio-group">
    <label class="st-radio-option">
      <input type="radio" name="difficulty" value="easy" checked> Easy (30 Letters)
    </label>
    <label class="st-radio-option">
      <input type="radio" name="difficulty" value="medium"> Medium (15 Words)
    </label>
    <label class="st-radio-option">
      <input type="radio" name="difficulty" value="hard"> Hard (10 Sentences)
    </label>
  </div>
  
  <div style="height: 150px; border: 1px solid #333333; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #666666;">
    [ Typing Box Area ]
  </div>
</div>

</body>
</html>
