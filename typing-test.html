<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speed Typing Test | OmniTools</title>
  <link rel="icon" type="image/png" href="favicon.png">
<meta name="description" content="Test your typing speed and accuracy in real-time. Track your WPM and improve your keyboard skills for free.">
<style>
  /* Original Home Button */
  .home-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #94a3b8;
    text-decoration: none;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-weight: 600;
    padding: 10px 18px;
    margin: 16px 24px;
    background-color: #1e293b;
    border: 1px solid #334155;
    border-radius: 8px;
    transition: all 0.2s ease;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 100;
  }
  .home-btn:hover {
    color: #f8fafc;
    border-color: #64748b;
    background-color: #334155;
  }
  
  /* Layout adjustments to accommodate native UI instead of iframe */
  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    background-color: #0e1117;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
  }
  
  .premium-banner {
    background: linear-gradient(to bottom, #312e81, #0e1117);
    padding: 24px 24px 30px 24px;
    text-align: center;
    flex-shrink: 0;
  }
  
  .banner-content {
    max-width: 750px;
    margin: 0 auto;
  }

  .premium-banner h1 {
    margin: 0 0 6px 0;
    font-size: 1.8rem;
    font-weight: 800;
    /* Indigo/Purple text gradient */
    background: linear-gradient(135deg, #a5b4fc, #6366f1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.02em;
  }
  
  .premium-banner p {
    margin: 0;
    font-size: 0.95rem;
    line-height: 1.4;
    color: #94a3b8;
  }
  
  .tool-wrapper {
    width: 100%;
    flex-grow: 1;
    background-color: #0e1117;
    position: relative;
    z-index: 90;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px 24px 60px 24px;
    overflow-y: auto;
    box-sizing: border-box;
  }

  /* --- New Native Tool Styles --- */
  .typing-app-container {
    background-color: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 700px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    box-shadow: 0 10px 20px -10px rgba(0,0,0,0.3);
  }

  .stats-row {
    display: flex;
    justify-content: space-between;
    background-color: #0f172a;
    padding: 16px 24px;
    border-radius: 8px;
    border: 1px solid #334155;
  }

  .stat-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .stat-title {
    font-size: 0.85rem;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }

  .stat-value {
    font-size: 1.5rem;
    font-weight: 700;
    color: #f8fafc;
  }

  .text-display {
    background-color: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 20px;
    font-size: 1.2rem;
    line-height: 1.6;
    color: #64748b;
    min-height: 120px;
    user-select: none;
  }

  .text-display span {
    transition: color 0.1s ease;
  }
  
  .text-display span.correct { color: #f8fafc; }
  .text-display span.incorrect { color: #ef4444; background-color: rgba(239, 68, 68, 0.1); border-radius: 2px;}
  .text-display span.active { border-bottom: 2px solid #6366f1; color: #f8fafc; }

  textarea {
    width: 100%;
    padding: 16px;
    border-radius: 8px;
    background-color: #0f172a;
    border: 1px solid #334155;
    color: #f8fafc;
    font-size: 1.1rem;
    font-family: inherit;
    resize: none;
    box-sizing: border-box;
    transition: border-color 0.2s ease;
  }

  textarea:focus {
    outline: none;
    border-color: #6366f1; /* Indigo Accent */
  }

  textarea:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .action-btn {
    background-color: #6366f1; /* Indigo Accent */
    color: #ffffff;
    padding: 14px 24px;
    border-radius: 8px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    width: 100%;
    transition: background-color 0.2s ease, transform 0.1s ease;
  }

  .action-btn:hover { background-color: #4f46e5; }
  .action-btn:active { transform: scale(0.98); }

  /* Mobile Responsive Fix */
  @media (max-width: 768px) {
    .home-btn {
      margin: 12px 16px;
      padding: 8px 14px;
      font-size: 0.85rem;
    }
    .premium-banner {
      padding-top: 70px;
    }
    .stats-row {
      padding: 12px;
    }
    .stat-value {
      font-size: 1.2rem;
    }
    .text-display, textarea {
      font-size: 1rem;
    }
  }
</style>
</head>
<body>
  <a href="index.html" class="home-btn">← Back to Home</a>

<div class="premium-banner">
  <div class="banner-content">
    <h1>Speed Typing Test</h1>
    <p>Test your typing speed and accuracy in real-time. Track your Words Per Minute (WPM), monitor your error rate, and improve your keyboard skills instantly in your browser.</p>
  </div>
</div>

<div class="tool-wrapper">
  
  <div class="typing-app-container">
    <div class="stats-row">
      <div class="stat-box">
        <span class="stat-title">Time</span>
        <span class="stat-value" id="timeLeft">60s</span>
      </div>
      <div class="stat-box">
        <span class="stat-title">WPM</span>
        <span class="stat-value" id="wpm">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-title">Accuracy</span>
        <span class="stat-value" id="accuracy">100%</span>
      </div>
    </div>

    <div class="text-display" id="textDisplay">Click "Start Test" to begin...</div>
    
    <textarea id="textInput" rows="3" placeholder="Start typing here..." disabled></textarea>
    
    <button class="action-btn" id="startBtn">Start Test</button>
  </div>

</div>

<script>
  const paragraphs = [
    "Technology is best when it brings people together. Fast typing helps you communicate complex ideas instantly across the globe without hesitation.",
    "In the middle of every difficulty lies opportunity. Consistent practice and muscle memory are the hidden keys to drastically improving your keyboard skills.",
    "The quick brown fox jumps over the lazy dog. This classic sentence contains every letter of the English alphabet and is perfect for warming up your hands.",
    "Success is not final, failure is not fatal: it is the courage to continue that counts. Keep pushing your limits and your typing speed will naturally increase."
  ];

  let timeLeft = 60;
  let timer = null;
  let isPlaying = false;
  let currentText = "";
  let charsTyped = 0;
  let errors = 0;

  const timeLeftDisplay = document.getElementById("timeLeft");
  const wpmDisplay = document.getElementById("wpm");
  const accuracyDisplay = document.getElementById("accuracy");
  const textDisplay = document.getElementById("textDisplay");
  const textInput = document.getElementById("textInput");
  const startBtn = document.getElementById("startBtn");

  function loadText() {
    textDisplay.innerHTML = "";
    currentText = paragraphs[Math.floor(Math.random() * paragraphs.length)];
    currentText.split("").forEach((char) => {
      let span = document.createElement("span");
      span.innerText = char;
      textDisplay.appendChild(span);
    });
    textDisplay.querySelector("span").classList.add("active");
  }

  function startTest() {
    loadText();
    clearInterval(timer);
    timeLeft = 60;
    charsTyped = 0;
    errors = 0;
    isPlaying = true;
    
    textInput.disabled = false;
    textInput.value = "";
    textInput.focus();
    
    timeLeftDisplay.innerText = "60s";
    wpmDisplay.innerText = "0";
    accuracyDisplay.innerText = "100%";
    startBtn.innerText = "Restart Test";
    
    timer = setInterval(updateTimer, 1000);
  }

  function updateTimer() {
    if (timeLeft > 0) {
      timeLeft--;
      timeLeftDisplay.innerText = timeLeft + "s";
      calculateStats();
    } else {
      endTest();
    }
  }

  function calculateStats() {
    let timeElapsed = 60 - timeLeft;
    if (timeElapsed === 0) timeElapsed = 1; // Prevent division by zero
    
    // WPM = (Total characters / 5) / time in minutes
    let wpm = Math.round(((charsTyped / 5) / timeElapsed) * 60);
    if (wpm < 0 || !wpm || wpm === Infinity) wpm = 0;
    
    // Accuracy = ((Total - Errors) / Total) * 100
    let accuracy = charsTyped === 0 ? 100 : Math.round(((charsTyped - errors) / charsTyped) * 100);
    if (accuracy < 0) accuracy = 0;

    wpmDisplay.innerText = wpm;
    accuracyDisplay.innerText = accuracy + "%";
  }

  function endTest() {
    clearInterval(timer);
    isPlaying = false;
    textInput.disabled = true;
    startBtn.innerText = "Start New Test";
  }

  textInput.addEventListener("input", () => {
    if (!isPlaying) return;

    let arrayQuote = textDisplay.querySelectorAll("span");
    let arrayValue = textInput.value.split("");
    
    charsTyped++;
    errors = 0;
    let allCorrect = true;

    arrayQuote.forEach((characterSpan, index) => {
      let character = arrayValue[index];
      characterSpan.classList.remove("active");

      if (character == null) {
        characterSpan.classList.remove("correct");
        characterSpan.classList.remove("incorrect");
        allCorrect = false;
      } else if (character === characterSpan.innerText) {
        characterSpan.classList.add("correct");
        characterSpan.classList.remove("incorrect");
      } else {
        characterSpan.classList.remove("correct");
        characterSpan.classList.add("incorrect");
        errors++;
        allCorrect = false;
      }
    });

    // Move active cursor indicator
    if (arrayValue.length < arrayQuote.length) {
      arrayQuote[arrayValue.length].classList.add("active");
    }

    // Auto-end if finished typing
    if (arrayValue.length === arrayQuote.length && allCorrect) {
      endTest();
      calculateStats(); 
    }
  });

  startBtn.addEventListener("click", startTest);
</script>
</body>
</html>
