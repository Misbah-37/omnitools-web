<style>
  /* The Spotlight Background */
  body {
    background-color: #0a0c10;
    background-image: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 60%);
    background-repeat: no-repeat;
  }

  /* The Elevated Header */
  .middle-ground-header {
    padding: 120px 24px 60px 24px;
    text-align: center;
  }

  /* Softly Tinted Icon */
  .icon-wrapper {
    width: 56px; 
    height: 56px; 
    margin: 0 auto 24px auto;
    background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
    border: 1px solid rgba(255, 255, 255, 0.1); 
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    border-radius: 14px;
    display: flex; 
    align-items: center; 
    justify-content: center; 
    color: #818cf8; /* Indigo accent */
  }

  /* Metallic Text Gradient */
  .middle-ground-header h1 {
    margin: 0 0 16px 0;
    font-size: 2.5rem;
    font-weight: 800;
    background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.03em;
  }

  /* Premium Primary Button */
  .btn-premium {
    background: linear-gradient(180deg, #6366f1 0%, #4f46e5 100%);
    color: white;
    border: 1px solid #4338ca;
    box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.39), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    padding: 14px 28px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
  }
</style>

<div class="middle-ground-header">
  <div class="icon-wrapper">
    <!-- SVG goes here -->
  </div>
  <h1>Typing Speed Test</h1>
  <p style="color: #94a3b8; max-width: 600px; margin: 0 auto 32px auto;">Test your typing speed and accuracy in real-time.</p>
  <button class="btn-premium">Start Typing Test</button>
</div>
