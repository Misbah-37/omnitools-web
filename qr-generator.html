<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Custom QR Code Generator | OmniTools</title>
  <link rel="icon" type="image/png" href="favicon.png">
<meta name="description" content="Create, customize, and securely download high-quality QR codes from any URL or text. 100% free and fast.">

<!-- QRious Library for Client-Side QR Generation -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

<style>
  /* --- Core OmniTools Layout --- */
  .home-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #94a3b8;
    text-decoration: none;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-weight: 600;
    padding: 10px 18px;
    margin: 16px 24px;
    background-color: #1e293b;
    border: 1px solid #334155;
    border-radius: 8px;
    transition: all 0.2s ease;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 100;
  }
  .home-btn:hover { color: #f8fafc; border-color: #64748b; background-color: #334155; }
  
  body, html {
    margin: 0; padding: 0; height: 100%;
    background-color: #0e1117;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column;
    overflow-x: hidden;
  }
  
  .premium-banner {
    background: linear-gradient(to bottom, #022c22, #0e1117);
    padding: 24px 24px 30px 24px;
    text-align: center; flex-shrink: 0;
    border-bottom: 1px solid #1e293b;
  }
  
  .banner-content { max-width: 750px; margin: 0 auto; }

  /* --- Integrated Icon & Header --- */
  .title-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 12px;
  }
  
  .app-icon {
    width: 65px; height: 65px;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); /* Emerald glow matching Python script */
    object-fit: cover;
  }

  .premium-banner h1 {
    margin: 0;
    font-size: 2.2rem;
    font-weight: 800;
    background: linear-gradient(135deg, #34d399, #10b981);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.02em;
  }
  
  .premium-banner p { margin: 0; font-size: 0.95rem; line-height: 1.4; color: #94a3b8; }
  
  .tool-wrapper {
    width: 100%; flex-grow: 1;
    background-color: #0e1117;
    padding: 40px 24px;
    box-sizing: border-box;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow-y: auto;
  }

  /* --- Native App UI Container --- */
  .tool-container { 
    background: #111827; 
    border: 1px solid #374151; 
    padding: 32px; 
    border-radius: 12px; 
    box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
    width: 100%; 
    max-width: 800px;
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 40px;
  }

  /* Input Column */
  label { 
    display: block; font-size: 0.9rem; font-weight: 600; 
    margin-bottom: 0.5rem; color: #9ca3af; 
  }
  
  textarea {
    width: 100%;
    padding: 12px;
    background: #1f2937;
    color: #fff;
    border: 1px solid #374151;
    border-radius: 8px;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 1rem;
    resize: vertical;
    min-height: 100px;
    margin-bottom: 20px;
    transition: border-color 0.2s;
  }
  textarea:focus { outline: none; border-color: #10b981; }

  .color-controls {
    display: flex;
    gap: 20px;
  }
  
  .color-group {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  
  input[type="color"] {
    width: 100%;
    height: 45px;
    padding: 2px;
    background: #1f2937;
    border: 1px solid #374151;
    border-radius: 8px;
    cursor: pointer;
    box-sizing: border-box;
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
  input[type="color"]::-webkit-color-swatch { border-radius: 4px; border: none; }

  /* Output Column */
  .output-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    border: 1px dashed #334155;
    border-radius: 8px;
    padding: 24px;
    min-height: 250px;
  }

  .placeholder-info {
    color: #64748b;
    font-size: 0.95rem;
    text-align: center;
    line-height: 1.5;
    padding: 20px;
  }

  canvas {
    border-radius: 4px;
    background: white;
    padding: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    display: none;
    max-width: 100%;
    height: auto;
  }

  .action-btn { 
    background: linear-gradient(135deg, #34d399 0%, #10b981 100%); 
    color: #064e3b; 
    border: none; 
    padding: 14px; 
    width: 100%; 
    border-radius: 8px; 
    font-weight: 800; 
    font-size: 1rem; 
    cursor: pointer; 
    margin-top: 24px; 
    transition: transform 0.1s, opacity 0.2s; 
    display: none;
  }
  .action-btn:hover { opacity: 0.9; }
  .action-btn:active { transform: scale(0.98); }

  @media (max-width: 768px) {
    .home-btn { margin: 12px 16px; padding: 8px 14px; font-size: 0.85rem; }
    .premium-banner { padding-top: 70px; }
    .tool-container { grid-template-columns: 1fr; gap: 24px; }
    .color-controls { flex-direction: column; gap: 12px; }
  }
</style>
</head>
<body>
  <a href="index.html" class="home-btn">← Back to Home</a>

<div class="premium-banner">
  <div class="banner-content">
    <div class="title-wrapper">
      <img src="qr_icon.png" alt="QR Code Generator" class="app-icon" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdib3g9IjAgMCAxMDAgMTAwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iIzEwYjk4MSIvPjwvc3ZnPg=='">
      <h1>Custom QR Code Generator</h1>
    </div>
    <p>Create, customize, and securely download high-quality QR codes from any URL or text. Select your custom foreground and background colors, and export high-resolution PNGs instantly.</p>
  </div>
</div>

<div class="tool-wrapper">
  
  <div class="tool-container">
    
    <!-- Input Section -->
    <div>
        <label for="qrInput">URL or Text to encode:</label>
        <textarea id="qrInput" placeholder="https://example.com"></textarea>
        
        <div class="color-controls">
            <div class="color-group">
                <label for="fgColor">QR Color</label>
                <input type="color" id="fgColor" value="#000000">
            </div>
            <div class="color-group">
                <label for="bgColor">Background</label>
                <input type="color" id="bgColor" value="#FFFFFF">
            </div>
        </div>
    </div>

    <!-- Output Section -->
    <div class="output-col">
        <div id="placeholder" class="placeholder-info">
            Enter a URL or text on the left to generate your QR code.
        </div>
        <canvas id="qrCanvas"></canvas>
        <button id="downloadBtn" class="action-btn">⬇️ Download (PNG)</button>
    </div>

  </div>

</div>

<script>
    const qrInput = document.getElementById('qrInput');
    const fgColor = document.getElementById('fgColor');
    const bgColor = document.getElementById('bgColor');
    const qrCanvas = document.getElementById('qrCanvas');
    const placeholder = document.getElementById('placeholder');
    const downloadBtn = document.getElementById('downloadBtn');

    // Initialize QRious instance
    const qr = new QRious({
        element: qrCanvas,
        size: 300,
        level: 'H' // High error correction
    });

    function generateQR() {
        const text = qrInput.value.trim();
        
        if (text) {
            // Hide placeholder, show canvas and button
            placeholder.style.display = 'none';
            qrCanvas.style.display = 'block';
            downloadBtn.style.display = 'block';
            
            // Update QR code data and colors
            qr.set({
                value: text,
                foreground: fgColor.value,
                background: bgColor.value
            });
        } else {
            // Revert to placeholder if input is empty
            placeholder.style.display = 'block';
            qrCanvas.style.display = 'none';
            downloadBtn.style.display = 'none';
        }
    }

    function downloadQR() {
        const link = document.createElement('a');
        link.download = 'OmniTools_QRCode.png';
        link.href = qrCanvas.toDataURL('image/png');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // Event Listeners for real-time generation
    qrInput.addEventListener('input', generateQR);
    fgColor.addEventListener('input', generateQR);
    bgColor.addEventListener('input', generateQR);
    
    // Download Listener
    downloadBtn.addEventListener('click', downloadQR);
</script>

</body>
</html>
