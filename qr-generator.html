<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Custom QR Code Generator | OmniTools</title>
  <link rel="icon" type="image/png" href="favicon.png">
<meta name="description" content="Create, customize, and securely download high-quality QR codes from any URL or text. 100% free and fast.">

<!-- Lightweight QR Code Library (CDN) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
  /* Home Button */
  .home-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #94a3b8;
    text-decoration: none;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-weight: 600;
    padding: 10px 18px;
    margin: 16px 24px;
    background-color: #1e293b;
    border: 1px solid #334155;
    border-radius: 8px;
    transition: all 0.2s ease;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 100;
  }
  .home-btn:hover {
    color: #f8fafc;
    border-color: #64748b;
    background-color: #334155;
  }
  
  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    background-color: #0e1117;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
  }
  
  .premium-banner {
    background: linear-gradient(to bottom, #022c22, #0e1117);
    padding: 24px 24px 30px 24px;
    text-align: center;
    flex-shrink: 0;
  }
  
  .banner-content {
    max-width: 750px;
    margin: 0 auto;
  }

  .premium-banner h1 {
    margin: 0 0 6px 0;
    font-size: 1.8rem;
    font-weight: 800;
    /* Emerald Green text gradient */
    background: linear-gradient(135deg, #34d399, #10b981);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.02em;
  }
  
  .premium-banner p {
    margin: 0;
    font-size: 0.95rem;
    line-height: 1.4;
    color: #94a3b8;
  }
  
  .tool-wrapper {
    width: 100%;
    flex-grow: 1;
    background-color: #0e1117;
    position: relative;
    z-index: 90;
    /* Added flex properties to center the new JS tool */
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px 24px 60px 24px;
    overflow-y: auto; /* Allows scrolling if screen is small */
    box-sizing: border-box;
  }

  /* New Native Tool Styles */
  .qr-app-container {
    background-color: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
    box-shadow: 0 10px 20px -10px rgba(0,0,0,0.3);
  }

  .qr-app-container input[type="text"] {
    width: 100%;
    padding: 14px 16px;
    border-radius: 8px;
    background-color: #0f172a;
    border: 1px solid #334155;
    color: #f8fafc;
    font-size: 1rem;
    box-sizing: border-box;
    transition: border-color 0.2s ease;
  }

  .qr-app-container input[type="text"]:focus {
    outline: none;
    border-color: #34d399;
  }

  .color-controls {
    display: flex;
    gap: 24px;
    width: 100%;
    justify-content: center;
    color: #94a3b8;
    font-size: 0.9rem;
    font-weight: 600;
  }

  .color-controls label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }

  .color-controls input[type="color"] {
    background: none;
    border: none;
    cursor: pointer;
    height: 32px;
    width: 32px;
    padding: 0;
    border-radius: 4px;
  }

  .action-btn {
    background-color: #10b981;
    color: #0e1117;
    padding: 14px 24px;
    border-radius: 8px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    width: 100%;
    transition: background-color 0.2s ease, transform 0.1s ease;
  }

  .action-btn:hover { background-color: #059669; }
  .action-btn:active { transform: scale(0.98); }

  #downloadBtn {
    background-color: #0f172a;
    border: 1px solid #334155;
    color: #f8fafc;
    display: none; /* Hidden until generated */
  }

  #downloadBtn:hover {
    border-color: #34d399;
    background-color: #1e293b;
  }

  #qrcode-container {
    background: white;
    padding: 20px;
    border-radius: 8px;
    display: none; /* Hidden until generated */
  }

  /* Mobile Responsive Fix */
  @media (max-width: 768px) {
    .home-btn {
      margin: 12px 16px;
      padding: 8px 14px;
      font-size: 0.85rem;
    }
    .premium-banner {
      padding-top: 70px;
    }
  }
</style>
</head>
<body>
  <a href="index.html" class="home-btn">← Back to Home</a>

<div class="premium-banner">
  <div class="banner-content">
    <h1>Custom QR Code Generator</h1>
    <p>Create, customize, and securely download high-quality QR codes from any URL or text. Select your custom foreground and background colors, and export high-resolution PNGs instantly.</p>
  </div>
</div>

<div class="tool-wrapper">
  
  <div class="qr-app-container">
    <input type="text" id="qrText" placeholder="Enter URL or text here..." autocomplete="off">
    
    <div class="color-controls">
      <label>
        Foreground: 
        <input type="color" id="qrColorDark" value="#000000">
      </label>
      <label>
        Background: 
        <input type="color" id="qrColorLight" value="#ffffff">
      </label>
    </div>

    <button class="action-btn" id="generateBtn">Generate QR Code</button>
    
    <div id="qrcode-container"></div>
    
    <button class="action-btn" id="downloadBtn">Download High-Res PNG</button>
  </div>

</div>

<script>
  const qrText = document.getElementById('qrText');
  const qrColorDark = document.getElementById('qrColorDark');
  const qrColorLight = document.getElementById('qrColorLight');
  const generateBtn = document.getElementById('generateBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const qrcodeContainer = document.getElementById('qrcode-container');
  
  generateBtn.addEventListener('click', () => {
    const text = qrText.value.trim();
    
    if (!text) {
      qrText.style.borderColor = '#ef4444';
      setTimeout(() => qrText.style.borderColor = '#334155', 1000);
      return;
    }
    
    // Reset previous QR code
    qrcodeContainer.innerHTML = '';
    qrcodeContainer.style.display = 'block';
    downloadBtn.style.display = 'block';
    
    // Generate new QR code dynamically checking the color inputs
    new QRCode(qrcodeContainer, {
      text: text,
      width: 250,
      height: 250,
      colorDark : qrColorDark.value,
      colorLight : qrColorLight.value,
      correctLevel : QRCode.CorrectLevel.H
    });
  });

  // Handle Image Download
  downloadBtn.addEventListener('click', () => {
    const img = qrcodeContainer.querySelector('img');
    const canvas = qrcodeContainer.querySelector('canvas');
    let imageSrc = null;

    if (img && img.src && img.src !== "") {
      imageSrc = img.src;
    } else if (canvas) {
      imageSrc = canvas.toDataURL("image/png");
    }

    if (imageSrc) {
      const link = document.createElement('a');
      link.href = imageSrc;
      link.download = 'OmniTools-QR-Code.png';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  });
  
  // Trigger generation on 'Enter' key
  qrText.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      generateBtn.click();
    }
  });
</script>

</body>
</html>
