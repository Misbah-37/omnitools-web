<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator | OmniTools</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="description" content="Instantly generate and download secure, high-quality QR codes.">
  
  <!-- Lightweight QR Code Library (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: #0e1117;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #f8fafc;
    }
    
    .header {
      padding: 40px 24px 20px;
      text-align: center;
    }
    .header h1 {
      margin: 0 0 10px 0;
      color: #10b981; /* OmniTools QR Emerald Accent */
    }
    .header a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }
    .header a:hover {
      color: #34d399;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 24px;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      box-shadow: 0 10px 20px -10px rgba(0,0,0,0.3);
    }
    .card-desc {
      margin: 0;
      color: #94a3b8;
      text-align: center;
      font-size: 1.05rem;
    }
    
    input[type="text"] {
      width: 100%;
      max-width: 400px;
      padding: 14px 16px;
      border-radius: 8px;
      background-color: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      font-size: 1rem;
      box-sizing: border-box;
      transition: border-color 0.2s ease;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #10b981;
    }
    
    .btn {
      background-color: #10b981;
      color: #0e1117;
      padding: 14px 24px;
      border-radius: 8px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      width: 100%;
      max-width: 400px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }
    .btn:hover {
      background-color: #059669;
    }
    .btn:active {
      transform: scale(0.98);
    }
    
    #qrcode-container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      display: none; /* Hidden until generated */
      margin-top: 10px;
    }
    
    #downloadBtn {
      background-color: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      display: none; /* Hidden until generated */
    }
    #downloadBtn:hover {
      border-color: #10b981;
      background-color: #1e293b;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>QR Code Generator</h1>
    <a href="index.html">← Back to OmniTools Suite</a>
  </div>
  
  <div class="container">
    <div class="card">
      <p class="card-desc">Enter a URL, Wi-Fi password, or text to generate a high-quality QR code locally.</p>
      
      <input type="text" id="qrText" placeholder="e.g., https://omnitools.com" autocomplete="off">
      <button class="btn" id="generateBtn">Generate QR Code</button>
      
      <!-- The library will inject the image/canvas here -->
      <div id="qrcode-container"></div>
      
      <button class="btn" id="downloadBtn">Download as PNG</button>
    </div>
  </div>

  <script>
    const qrText = document.getElementById('qrText');
    const generateBtn = document.getElementById('generateBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const qrcodeContainer = document.getElementById('qrcode-container');
    
    generateBtn.addEventListener('click', () => {
      const text = qrText.value.trim();
      
      if (!text) {
        qrText.style.borderColor = '#ef4444'; // Red flash for empty input
        setTimeout(() => qrText.style.borderColor = '#334155', 1000);
        return;
      }
      
      // Reset previous QR code
      qrcodeContainer.innerHTML = '';
      qrcodeContainer.style.display = 'block';
      downloadBtn.style.display = 'block';
      
      // Generate new QR code using the CDN library
      new QRCode(qrcodeContainer, {
        text: text,
        width: 220,
        height: 220,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H // High error correction
      });
    });

    // Handle Image Download
    downloadBtn.addEventListener('click', () => {
      const img = qrcodeContainer.querySelector('img');
      const canvas = qrcodeContainer.querySelector('canvas');
      let imageSrc = null;

      // Extract raw image data
      if (img && img.src) {
        imageSrc = img.src;
      } else if (canvas) {
        imageSrc = canvas.toDataURL("image/png");
      }

      if (imageSrc) {
        const link = document.createElement('a');
        link.href = imageSrc;
        link.download = 'omnitools-qrcode.png';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    });
    
    // Trigger generation on 'Enter' key
    qrText.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        generateBtn.click();
      }
    });
  </script>
</body>
</html>
