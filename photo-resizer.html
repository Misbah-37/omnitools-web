<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Image & Photo Resizer | OmniTools</title>
<meta name="description" content="Resize, compress, and convert images locally without uploading to any external servers. Secure in-browser processing.">
<style>
  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background-color: #0e1117;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  
  /* The upgraded aesthetic banner */
  .premium-banner {
    background: linear-gradient(to bottom, #111827, #0e1117);
    border-bottom: 1px solid #1e293b;
    padding: 32px 24px;
    text-align: center;
    flex-shrink: 0;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
    z-index: 50;
  }
  
  .premium-banner h1 {
    margin: 0 0 12px 0;
    font-size: 2.2rem;
    font-weight: 800;
    /* Cyan to Indigo gradient matching your glowing icon */
    background: linear-gradient(135deg, #38bdf8, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.02em;
  }
  
  .premium-banner p {
    margin: 0 auto;
    font-size: 1rem;
    line-height: 1.6;
    color: #94a3b8;
    max-width: 750px;
    font-weight: 400;
  }
  
  .tool-wrapper {
    width: 100%;
    flex-grow: 1;
    position: relative;
  }
  
  iframe {
    border: none;
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
  }
</style>
</head>
<body>

<!-- High-end visible SEO header -->
<div class="premium-banner">
  <h1>Image & Photo Resizer</h1>
  <p>Resize, compress, and convert images locally without uploading to any external servers. Choose your target dimensions or file size, and export instantly. Because processing happens in your browser, your photos stay 100% private and never leave your device.</p>
</div>

<!-- The actual Streamlit App -->
<div class="tool-wrapper">
  <iframe src="https://omnitools.streamlit.app/Photo_Resizer?embed=true" allow="clipboard-read; clipboard-write;">
    <p>Your browser does not support iframes. Please visit our tool directly.</p>
  </iframe>
</div>

</body>
</html>
