<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Image & Photo Resizer | OmniTools</title>
<meta name="description" content="Resize, compress, and convert images locally without uploading to any external servers. Secure in-browser processing.">
<style>
  /* Lock the outer page so it never scrolls, eliminating all flickering */
  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background-color: #0e1117;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
  }
  
  /* Fixed, beautiful gradient header that stays put */
  .premium-banner {
    background: linear-gradient(to bottom, #064e3b, #0e1117);
    padding: 24px 24px 30px 24px;
    text-align: center;
    flex-shrink: 0;
  }
  
  .banner-content {
    max-width: 750px;
    margin: 0 auto;
  }

  .premium-banner h1 {
    margin: 0 0 6px 0;
    font-size: 1.8rem;
    font-weight: 800;
    background: linear-gradient(135deg, #34d399, #38bdf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.02em;
  }
  
  .premium-banner p {
    margin: 0;
    font-size: 0.95rem;
    line-height: 1.4;
    color: #94a3b8;
  }
  
  /* Container that cleanly fills the rest of the screen */
  .tool-wrapper {
    width: 100%;
    flex-grow: 1;
    background-color: #0e1117;
  }
  
  iframe {
    border: none;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>

<!-- Clean, non-flickering fixed banner -->
<div class="premium-banner">
  <div class="banner-content">
    <h1>Image & Photo Resizer</h1>
    <p>Resize, compress, and convert images locally without uploading to any external servers. Your photos stay 100% private and never leave your device.</p>
  </div>
</div>

<!-- The Streamlit App Iframe handles its own internal scrolling smoothly -->
<div class="tool-wrapper">
  <iframe src="https://omnitools.streamlit.app/Photo_Resizer?embed=true" allow="clipboard-read; clipboard-write;">
    <p>Your browser does not support iframes. Please visit our tool directly.</p>
  </iframe>
</div>

</body>
</html>
