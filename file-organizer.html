<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desktop File Organizer | OmniTools</title>
  <link rel="icon" type="image/png" href="favicon.png">
<meta name="description" content="Free, secure, and private PDF utility tool.
  Merge, split, extract pages, and convert documents directly in your browser
  with zero data retention.">
<style>
  /* Home Button */
.home-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: #94a3b8;
  text-decoration: none;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-weight: 600;
  padding: 10px 18px;
  margin: 16px 24px;
  background-color: #1e293b;
  border: 1px solid #334155;
  border-radius: 8px;
  transition: all 0.2s ease;
  position: absolute;
  top: 0;
  left: 0;
  z-index: 100;
  
}
.home-btn:hover {
  color: #f8fafc;
  border-color: #64748b;
  background-color: #334155;
}
  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background-color: #0e1117;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
  }
  
  .premium-banner {
    background: linear-gradient(to bottom, #064e3b, #0e1117);
    padding: 24px 24px 30px 24px;
    text-align: center;
    flex-shrink: 0;
  }
  
  .banner-content {
    max-width: 750px;
    margin: 0 auto;
  }

  .premium-banner h1 {
    margin: 0 0 6px 0;
    font-size: 1.8rem;
    font-weight: 800;
    /* Teal/Mint text gradient */
    background: linear-gradient(135deg, #6ee7b7, #34d399);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.02em;
  }
  
  .premium-banner p {
    margin: 0;
    font-size: 0.95rem;
    line-height: 1.4;
    color: #94a3b8;
  }
  
  .tool-wrapper {
    width: 100%;
    flex-grow: 1;
    background-color: #0e1117;
    margin-top: -20px;
    position: relative;
    z-index: 90;
  }
  
  iframe {
    border: none;
    width: 100%;
    height: 100%;
    display: block;
  }
/* Mobile Responsive Fix */
@media (max-width: 768px) {
  .home-btn {
    margin: 12px 16px;
    padding: 8px 14px;
    font-size: 0.85rem;
  }
  .premium-banner {
    padding-top: 70px; /* Pushes the title down below the floating button */
  }
}
</style>
</head>
<body>
  <a href="index.html" class="home-btn">← Back to Home</a>

<div class="premium-banner">
  <div class="banner-content">
    <h1>Desktop File Organizer</h1>
    <p>A standalone, verified Windows application designed to instantly organize messy folders on your PC into 12 clean categories. Completely secure, running entirely on your local machine.</p>
  </div>
</div>

<div class="tool-wrapper">
  <iframe src="https://omnitools.streamlit.app/File_Organizer?embed=true" allow="clipboard-read; clipboard-write;">
    <p>Your browser does not support iframes. Please visit our tool directly.</p>
  </iframe>
</div>

</body>
</html>
