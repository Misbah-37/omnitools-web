<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=https://runtangent.com/">
  <link rel="canonical" href="https://runtangent.com/">
  <title>Redirecting to Tangent...</title>
  <script>
    (function() {
      const path = window.location.pathname;
      const match = path.match(/([a-zA-Z0-9_-]+\.html)/);
      if (match) {
        window.location.replace("https://runtangent.com/" + match[1]);
      } else {
        window.location.replace("https://runtangent.com/");
      }
    })();
  </script>
  <style>
    body {
      background-color: #08090d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background-color: #11141d;
      border: 1px solid #1f2533;
      border-radius: 14px;
      padding: 36px 30px;
      max-width: 460px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
    }
    h2 {
      margin: 0 0 12px 0;
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin: 0 0 24px 0;
      line-height: 1.6;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #00d2ff;
      color: #08090d;
      text-decoration: none;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 0.95rem;
    }
    .btn:hover { background: #33ddff; }
  </style>
</head>
<body>
  <div class="card">
    <h2>OmniTools is now Tangent</h2>
    <p>This utility has permanently moved to <strong>Tangent</strong>. Forwarding you to the modern suite...</p>
    <a href="https://runtangent.com/" class="btn">Continue to Tangent</a>
  </div>
</body>
</html>
